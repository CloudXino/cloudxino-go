name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- types.gen.go
      - name: gofmt
        run: test -z "$(gofmt -l .)"
